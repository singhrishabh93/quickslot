name: swades_hackathon_app
description: "QuickSlot — Swades Hackathon"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.0.3

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Routing
  auto_route: ^9.2.2

  # Storage
  shared_preferences: ^2.3.3

  # Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  auto_route_generator: ^9.0.0

flutter:
  uses-material-design: true
